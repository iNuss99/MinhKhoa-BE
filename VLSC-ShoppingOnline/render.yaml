services:
  - type: web
    name: vlsc-shopping-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SERVER
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_DATABASE
        value: shoppingonline
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES
        value: "86400000"
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
